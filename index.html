<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WM 성과관리 시스템</title>
    <style>
        /* [기본 설정] */
        :root { --mir-blue: #002d72; --mir-orange: #f26522; --gray-bg: #f5f7fa; }
        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; background-color: var(--gray-bg); }
        
        /* [1. 로그인 화면 스타일] - 무조건 맨 위에 뜨게 설정 */
        #login-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background-color: var(--mir-blue); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            color: white;
        }
        .login-box { background: white; width: 80%; max-width: 350px; padding: 30px; border-radius: 10px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .login-btn { width: 100%; padding: 12px; background-color: var(--mir-orange); color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        /* [2. 메인 앱 스타일] - 처음엔 숨김 */
        #main-app { display: none; height: 100%; flex-direction: column; }
        
        /* 헤더 */
        .header { height: 50px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .logo { font-weight: bold; color: var(--mir-blue); font-size: 18px; }
        .user-info { font-size: 13px; color: #666; }

        /* 컨텐츠 영역 (좌우 분할) */
        .content-wrap { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* 좌측 사이드바 (리스트) */
        .sidebar { width: 320px; background: white; border-right: 1px solid #eee; display: flex; flex-direction: column; }
        .list-header { padding: 15px; background: #f9f9f9; border-bottom: 1px solid #eee; font-weight: bold; color: #555; text-align: center; }
        .staff-list { flex: 1; overflow-y: auto; }
        .staff-item { padding: 15px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; }
        .staff-item:hover { background-color: #f0f8ff; }
        .staff-item.active { background-color: #e6f4ff; border-left: 4px solid var(--mir-blue); }

        /* 우측 대시보드 (상세) */
        .dashboard { flex: 1; padding: 20px; overflow-y: auto; background-color: var(--gray-bg); }
        
        /* 1x3 카드 영역 */
        .top-cards { display: flex; gap: 10px; margin-bottom: 20px; }
        .card { flex: 1; background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-title { font-size: 12px; color: #888; margin-bottom: 5px; }
        .card-val { font-size: 18px; font-weight: bold; color: var(--mir-blue); }

        /* 백분율 지표 영역 */
        .metric-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .metric-row { margin-bottom: 15px; }
        .metric-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        .progress-bg { background: #eee; height: 10px; border-radius: 5px; overflow: hidden; position: relative; }
        .progress-bar { height: 100%; background: var(--mir-blue); width: 0%; transition: width 0.5s; }
        
        /* BEP 마커 (빨간선) */
        .bep-line { position: absolute; top: 0; bottom: 0; width: 2px; background: red; z-index: 5; }
        .bep-text { position: absolute; top: -15px; font-size: 10px; color: red; transform: translateX(-50%); }

        /* [모바일 반응형] */
        @media (max-width: 768px) {
            .content-wrap { flex-direction: column; }
            .sidebar { width: 100%; height: 100%; position: absolute; z-index: 10; transition: 0.3s; }
            .dashboard { width: 100%; height: 100%; position: absolute; z-index: 20; transform: translateX(100%); transition: 0.3s; }
            
            /* 클래스 추가 시 화면 전환 */
            .view-dashboard .sidebar { transform: translateX(-30%); display: none; }
            .view-dashboard .dashboard { transform: translateX(0); }
            
            .back-btn { display: inline-block; padding: 5px 10px; margin-bottom: 10px; background: #ddd; border-radius: 4px; font-size: 12px; cursor: pointer; }
        }
        @media (min-width: 769px) { .back-btn { display: none; } }

    </style>
</head>
<body>

    <div id="login-screen">
        <h2 style="margin-bottom: 5px;">WM 성과관리</h2>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 0;">Organization Management System</p>
        <div class="login-box">
            <input type="text" id="ipt-id" class="login-input" placeholder="사번 (예: 1111)">
            <input type="password" id="ipt-birth" class="login-input" placeholder="생년월일 (예: 800101)">
            <button class="login-btn" onclick="login()">접속하기</button>
            <p id="msg-error" style="color: #ffbdbd; font-size: 12px; display: none; margin-top: 10px;">정보가 일치하지 않습니다.</p>
        </div>
        <div style="margin-top: 20px; font-size: 12px; opacity: 0.6;">
            [Test Account]<br>강남지점장: 1111 / 800101<br>여의도지점장: 2222 / 820505
        </div>
    </div>

    <div id="main-app">
        <div class="header">
            <div class="logo">MIRAE ASSET</div>
            <div class="user-info" id="disp-user">님</div>
        </div>

        <div class="content-wrap" id="content-wrap">
            <div class="sidebar">
                <div class="list-header">소속 직원 명단</div>
                <div class="staff-list" id="list-area">
                    </div>
            </div>

            <div class="dashboard">
                <div class="back-btn" onclick="goBack()">← 목록으로</div>
                <h2 id="dash-title" style="margin-top: 0; font-size: 18px;">직원을 선택해주세요</h2>
                
                <div class="top-cards">
                    <div class="card">
                        <div class="card-title">자산(억)</div>
                        <div class="card-val" id="v-asset">-</div>
                    </div>
                    <div class="card">
                        <div class="card-title">수익(억)</div>
                        <div class="card-val" id="v-rev">-</div>
                    </div>
                    <div class="card">
                        <div class="card-title">컨설팅(억)</div>
                        <div class="card-val" id="v-con">-</div>
                    </div>
                </div>

                <div class="metric-box" id="metrics-area">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // [데이터 베이스]
        // ==========================================
        
        // 1. 조직장 정보
        var managers = [
            { id: "1111", birth: "800101", name: "김강남", code: "Gangnam", brName: "강남WM" },
            { id: "2222", birth: "820505", name: "이여의", code: "Yeouido", brName: "여의도WM" }
        ];

        // 2. 직원 정보 (code로 매핑)
        var staffs = [
            { id: "s1", name: "박수석", role: "수석PB", code: "Gangnam" },
            { id: "s2", name: "최선임", role: "선임PB", code: "Gangnam" },
            { id: "s3", name: "정디지털", role: "WM디지털PB", code: "Gangnam" },
            { id: "s4", name: "오책임", role: "책임PB", code: "Yeouido" }
        ];

        // 3. 성과 데이터 (퍼센트 및 BEP)
        // bep1: 인정수익 BEP 위치(%), bep2: 컨설팅 BEP 위치(%)
        var perfData = {
            "s1": { asset: 3200, rev: 5.2, con: 1.5, p_asset: 105, p_rev: 95, p_con: 80, p_kpi: 92, bep1: 80, bep2: 60 },
            "s2": { asset: 1500, rev: 2.5, con: 0.8, p_asset: 80, p_rev: 70, p_con: 50, p_kpi: 75, bep1: 80, bep2: 60 },
            "s3": { asset: 800, rev: 1.2, con: 0.3, p_asset: 120, p_rev: 110, p_con: 40, p_kpi: 88, bep1: 50, bep2: 30 },
            "s4": { asset: 2100, rev: 4.0, con: 1.2, p_asset: 100, p_rev: 100, p_con: 100, p_kpi: 100, bep1: 100, bep2: 100 }
        };

        // ==========================================
        // [로직]
        // ==========================================
        
        var myUser = null;

        // 1. 로그인
        function login() {
            try {
                var id = document.getElementById('ipt-id').value;
                var birth = document.getElementById('ipt-birth').value;
                
                var found = null;
                for(var i=0; i<managers.length; i++) {
                    if(managers[i].id === id && managers[i].birth === birth) {
                        found = managers[i];
                        break;
                    }
                }

                if(found) {
                    myUser = found;
                    document.getElementById('login-screen').style.display = 'none'; // 로그인 숨김
                    document.getElementById('main-app').style.display = 'flex';     // 메인 표시
                    document.getElementById('disp-user').innerText = myUser.name + " (" + myUser.brName + ")";
                    renderList();
                } else {
                    document.getElementById('msg-error').style.display = 'block';
                }
            } catch(e) {
                alert("로그인 중 오류: " + e.message);
            }
        }

        // 2. 리스트 그리기
        function renderList() {
            var area = document.getElementById('list-area');
            var html = '';
            
            // 내 지점 직원만 필터링
            for(var i=0; i<staffs.length; i++) {
                if(staffs[i].code === myUser.code) {
                    html += '<div class="staff-item" onclick="showDetail(\'' + staffs[i].id + '\', \'' + staffs[i].name + '\')">' +
                            '<div><strong>' + staffs[i].name + '</strong><br><span style="font-size:12px; color:#888">' + staffs[i].role + '</span></div>' +
                            '<div style="color:#ccc;">></div>' +
                            '</div>';
                }
            }
            area.innerHTML = html;
        }

        // 3. 상세 화면 보이기
        function showDetail(sid, sname) {
            // 모바일 화면 전환
            document.getElementById('content-wrap').classList.add('view-dashboard');
            
            document.getElementById('dash-title').innerText = sname + "님의 성과";
            
            var d = perfData[sid];
            if(!d) d = { asset:0, rev:0, con:0, p_asset:0, p_rev:0, p_con:0, p_kpi:0, bep1:0, bep2:0 };

            // 1x3 카드 업데이트
            document.getElementById('v-asset').innerText = d.asset.toLocaleString();
            document.getElementById('v-rev').innerText = d.rev;
            document.getElementById('v-con').innerText = d.con;

            // 6대 지표 그리기
            drawMetrics(d);
        }

        function drawMetrics(d) {
            var area = document.getElementById('metrics-area');
            var metrics = [
                { label: "자산 달성률", val: d.p_asset },
                { label: "수익 달성률", val: d.p_rev },
                { label: "컨설팅 달성률", val: d.p_con },
                { label: "KPI 종합", val: d.p_kpi },
                { label: "인정수익 BEP", val: d.p_rev, bep: d.bep1 }, // 달성률 vs BEP 비교
                { label: "컨설팅 BEP", val: d.p_con, bep: d.bep2 }
            ];

            var html = '<h4 style="margin:0 0 15px 0">상세 지표 분석</h4>';

            for(var i=0; i<metrics.length; i++) {
                var m = metrics[i];
                var barColor = (m.val >= 100) ? '#f26522' : '#002d72'; // 달성시 오렌지, 미달성시 블루
                
                // BEP 라인 생성 (있는 경우에만)
                var bepLine = '';
