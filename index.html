<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WM혁신팀 KPI 인사이트2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .header { background-color: #002d72; color: white; padding: 25px 20px; text-align: center; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* 직원 리스트 카드 */
        .staff-card { background: white; padding: 15px 20px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid transparent; }
        .staff-card:hover { transform: translateY(-2px); }
        .staff-card.high { border-left-color: #f26522; } /* 상위권 포인트 컬러 */
        .staff-card.low { border-left-color: #999; }
        
        .staff-info h3 { margin: 0; font-size: 17px; font-weight: 700; }
        .staff-info p { margin: 5px 0 0; font-size: 13px; color: #666; }
        .current-score { font-weight: 800; color: #002d72; font-size: 20px; }

        /* 모달 (상세 보기) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; width: 85%; max-width: 400px; padding: 25px; border-radius: 16px; position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 15px; right: 20px; cursor: pointer; font-size: 24px; color: #999; }
        
        /* 로딩/에러 메시지 */
        #error-msg { text-align: center; color: red; display: none; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="margin:0; font-size:20px;">WM혁신팀 성과 분석</h3>
        <p style="margin:5px 0 0; font-size:13px; opacity:0.8;">실시간 KPI 모니터링 시스템</p>
    </div>

    <div class="container">
        <div id="staff-list">
            </div>
        <div id="error-msg">데이터를 불러오는 중입니다...</div>
    </div>

    <div id="detail-modal" class="modal" onclick="if(event.target == this) closeModal()">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-name" style="margin:0 0 5px 0;">-</h2>
            <p id="modal-role" style="color:#666; font-size:14px; margin:0;">-</p>
            <div style="margin-top:20px; height:250px;">
                <canvas id="kpiChart"></canvas>
            </div>
            <p style="text-align:center; font-size:12px; color:#999; margin-top:15px;">
                * 터치하면 팝업이 닫힙니다.
            </p>
        </div>
    </div>

    <script>
        // 안전장치: 화면이 다 로딩된 후 실행
        document.addEventListener('DOMContentLoaded', function() {
            
            // 1. 데이터 베이스 (수정 영역)
            const database = [
                { id: 1, name: "김미래", role: "선임PB (관리자)", kpi: "125%", history:, status: "high" },
                { id: 2, name: "이증권", role: "WM디지털PB", kpi: "95%", history:, status: "low" },
                { id: 3, name: "박혁신", role: "수석PB", kpi: "105%", history:, status: "high" },
                { id: 4, name: "최자산", role: "WM디지털PB", kpi: "88%", history:, status: "low" }
            ];

            const listContainer = document.getElementById('staff-list');
            const modal = document.getElementById('detail-modal');
            let myChart = null;

            // 2. 리스트 렌더링 함수
            function renderList() {
                if (!listContainer) {
                    alert("시스템 오류: 화면 요소를 찾을 수 없습니다.");
                    return;
                }

                listContainer.innerHTML = ''; // 초기화

                database.forEach(function(staff) {
                    const card = document.createElement('div');
                    card.className = `staff-card ${staff.status}`; // 상태별 색상 적용
                    card.innerHTML = `
                        <div class="staff-info">
                            <h3>${staff.name}</h3>
                            <p>${staff.role}</p>
                        </div>
                        <div class="current-score">${staff.kpi}</div>
                    `;
                    // 클릭 이벤트 연결
                    card.addEventListener('click', function() {
                        showDetail(staff);
                    });
                    listContainer.appendChild(card);
                });
            }

            // 3. 차트 및 상세 보기 함수
            window.showDetail = function(staff) {
                // 모달 텍스트 채우기
                document.getElementById('modal-name').innerText = staff.name;
                document.getElementById('modal-role').innerText = staff.role;
                modal.style.display = 'flex';

                // 차트 그리기 (Chart.js 로딩 체크)
                if (typeof Chart === 'undefined') {
                    alert("보안망 이슈로 차트 라이브러리를 불러오지 못했습니다.\n(리스트 확인은 가능합니다)");
                    return;
                }

                const ctx = document.getElementById('kpiChart').getContext('2d');
                
                if (myChart) {
                    myChart.destroy(); // 기존 차트 삭제
                }

                myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['1Q', '2Q', '3Q', '4Q'],
                        datasets: [{
                            label: '성과 달성률(%)',
                            data: staff.history,
                            borderColor: '#f26522',
                            backgroundColor: 'rgba(242, 101, 34, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: false, min: 50, max: 150 } }
                    }
                });
            };

            // 4. 모달 닫기 함수
            window.closeModal = function() {
                modal.style.display = 'none';
            };

            // 실행
            renderList();
        });
    </script>
</body>
</html>
