<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WM 성과관리 시스템</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* [기본 스타일: 미래에셋 컬러 적용] */
        :root { 
            --mir-blue: #002d72; 
            --mir-orange: #f26522; 
            --bg-gray: #f4f7f6;
            --text-dark: #333;
            --white: #fff;
        }
        body { font-family: 'Pretendard', -apple-system, sans-serif; margin: 0; background-color: var(--bg-gray); color: var(--text-dark); height: 100vh; overflow: hidden; }
        
        /* 1. 로그인 화면 */
        #login-page { position: fixed; width: 100%; height: 100%; background: var(--mir-blue); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .login-box { background: white; width: 85%; max-width: 320px; padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .login-btn { width: 100%; padding: 12px; margin-top: 15px; background: var(--mir-orange); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* 2. 메인 앱 레이아웃 */
        #app-container { display: none; height: 100%; flex-direction: column; }
        
        /* 헤더 */
        .app-header { background: var(--white); border-bottom: 1px solid #ddd; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-area { font-weight: bold; color: var(--mir-blue); font-size: 18px; }
        .user-area { font-size: 13px; color: #666; }
        
        /* 컨텐츠 영역 (좌우 분할) */
        .content-body { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* 좌측: 직원 리스트 & 탭 */
        .sidebar { width: 320px; background: white; border-right: 1px solid #ddd; display: flex; flex-direction: column; z-index: 10; }
        .tab-menu { display: flex; border-bottom: 1px solid #eee; }
        .tab { flex: 1; padding: 15px 0; text-align: center; font-size: 14px; font-weight: bold; color: #888; cursor: pointer; background: #f9f9f9; }
        .tab.active { background: white; color: var(--mir-blue); border-bottom: 2px solid var(--mir-blue); }
        
        .list-wrap { flex: 1; overflow-y: auto; }
        .list-item { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .list-item:hover { background-color: #f5faff; }
        .list-item.selected { background-color: #eef4ff; border-left: 4px solid var(--mir-blue); }
        .staff-name { font-weight: bold; font-size: 15px; }
        .staff-role { font-size: 12px; color: #888; margin-top: 4px; }

        /* 우측: 상세 대시보드 */
        .dashboard { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-gray); }
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .dash-title { font-size: 20px; font-weight: bold; color: #333; }
        .quarter-select { padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-size: 14px; }

        /* [핵심 1] 1x3 카드 레이아웃 */
        .top-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .card { background: white; padding: 20px 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .card-label { font-size: 12px; color: #666; margin-bottom: 8px; }
        .card-value { font-size: 18px; font-weight: bold; color: var(--mir-blue); }
        .card-unit { font-size: 12px; font-weight: normal; color: #888; }

        /* [핵심 2] 백분율 지표 리스트 */
        .metrics-container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .metric-row { margin-bottom: 20px; }
        .metric-row:last-child { margin-bottom: 0; }
        .metric-info { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .metric-name { font-weight: bold; color: #555; }
        .metric-val { color: var(--mir-orange); font-weight: bold; }
        
        .progress-bg { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; }
        .progress-bar { height: 100%; border-radius: 5px; background: var(--mir-blue); width: 0%; transition: width 1s ease; position: relative; }
        /* BEP 라인 표시용 (가상 요소) */
        .bep-marker { position: absolute; top: 0; bottom: 0; width: 2px; background: red; z-index: 5; }

        /* 모바일 반응형 처리 */
        @media (max-width: 768px) {
            .content-body { flex-direction: column; }
            .sidebar { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transition: transform 0.3s; }
            .dashboard { width: 100%; height: 100%; position: absolute; top: 0; left: 0; background: var(--bg-gray); transform: translateX(100%); transition: transform 0.3s; z-index: 20; box-sizing: border-box; }
            
            /* 모바일 화면 전환 클래스 */
            .show-dashboard .sidebar { transform: translateX(-30%); display: none; } 
            .show-dashboard .dashboard { transform: translateX(0); }
            
            .back-btn { display: inline-block; padding: 5px 10px; margin-bottom: 15px; background: #ddd; border-radius: 20px; font-size: 12px; font-weight: bold; color: #555; cursor: pointer; }
        }
        @media (min-width: 769px) {
            .back-btn { display: none; }
        }
    </style>
</head>
<body>

    <div id="login-page">
        <div style="font-size: 40px; margin-bottom: 10px;"><i class="fas fa-chart-line"></i></div>
        <h2>WM 성과관리</h2>
        <div class="login-box">
            <input type="text" id="login-id" class="login-input" placeholder="사번 (예: 1111)">
            <input type="password" id="login-birth" class="login-input" placeholder="생년월일 (예: 800101)">
            <button class="login-btn" onclick="handleLogin()">접속하기</button>
            <p id="login-msg" style="color:#ffcccc; font-size:13px; margin-top:10px; display:none;">정보를 확인해주세요.</p>
        </div>
        <div style="margin-top:20px; font-size:12px; opacity:0.7;">
            * Test: 사번 1111 / 생년 800101 (강남지점장)<br>
            * Test: 사번 2222 / 생년 820505 (여의도지점장)
        </div>
    </div>

    <div id="app-container">
        <div class="app-header">
            <div class="logo-area">MIRAE ASSET <span style="font-weight:normal; font-size:14px;">WM</span></div>
            <div class="user-area">
                <span id="user-display">로그인 중...</span>
                <span style="margin-left:10px; cursor:pointer; text-decoration:underline;" onclick="location.reload()">로그아웃</span>
            </div>
        </div>

        <div class="content-body" id="content-body">
            <div class="sidebar">
                <div class="tab-menu">
                    <div class="tab active" onclick="setTab('team')">지점 현황</div>
                    <div class="tab" onclick="setTab('staff')">직원 명단</div>
                </div>
                <div class="list-wrap" id="list-container">
                    </div>
            </div>

            <div class="dashboard">
                <div class="back-btn" onclick="closeDashboard()">← 목록으로</div>
                
                <div class="dash-header">
                    <div class="dash-title" id="dash-title">전체 요약</div>
                    <select class="quarter-select" id="q-select" onchange="renderDashboard()">
                        <option value="q1">2024 1분기</option>
                        <option value="q2" selected>2024 2분기</option>
                        <option value="q3">2024 3분기</option>
                    </select>
                </div>

                <div class="top-cards">
                    <div class="card">
                        <div class="card-label">총 자산</div>
                        <div class="card-value" id="val-asset">-</div>
                    </div>
                    <div class="card">
                        <div class="card-label">총 수익</div>
                        <div class="card-value" id="val-rev">-</div>
                    </div>
                    <div class="card">
                        <div class="card-label">컨설팅 수익</div>
                        <div class="card-value" id="val-consult">-</div>
                    </div>
                </div>

                <div class="metrics-container">
                    <h4 style="margin:0 0 20px 0; color:#333;">성과 상세 지표 (달성률)</h4>
                    
                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">자산 달성률</span><span class="metric-val" id="per-asset">0%</span></div>
                        <div class="progress-bg"><div class="progress-bar" id="bar-asset"></div></div>
                    </div>
                    
                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">수익 달성률</span><span class="metric-val" id="per-rev">0%</span></div>
                        <div class="progress-bg"><div class="progress-bar" id="bar-rev"></div></div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">컨설팅 수익 달성률</span><span class="metric-val" id="per-consult">0%</span></div>
                        <div class="progress-bg"><div class="progress-bar" id="bar-consult"></div></div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">KPI 종합 달성률</span><span class="metric-val" id="per-kpi">0%</span></div>
                        <div class="progress-bg"><div class="progress-bar" id="bar-kpi" style="background-color: #6c5ce7;"></div></div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">인정수익 BEP 달성도</span><span class="metric-val" id="per-bep1">0%</span></div>
                        <div class="progress-bg">
                            <div class="progress-bar" id="bar-bep1" style="background-color: #00b894;"></div>
                            <div style="position:absolute; left:80%; top:-15px; font-size:10px; color:red;">▼ BEP</div>
                        </div>
                    </div>

                    <div class="metric-row">
                        <div class="metric-info"><span class="metric-name">컨설팅 BEP 달성도</span><span class="metric-val" id="per-bep2">0%</span></div>
                        <div class="progress-bg">
                            <div class="progress-bar" id="bar-bep2" style="background-color: #00b894;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===============================================
        // [무료 DB 영역] JSON 데이터 수정만으로 운영 가능
        // ===============================================
        
        // 1. 관리자(조직장) DB
        const managerDB = [
            { id: "1111", birth: "800101", name: "김강남", orgCode: "WM_KANGNAM", orgName: "강남WM센터" },
            { id: "2222", birth: "820505", name: "이여의", orgCode: "WM_YEOUIDO", orgName: "여의도WM센터" }
        ];

        // 2. 직원 명부 DB (orgCode로 매핑)
        const staffDB = [
            // 강남WM 소속
            { id: "S01", name: "박수석", role: "수석PB", orgCode: "WM_KANGNAM" },
            { id: "S02", name: "최선임", role: "선임PB", orgCode: "WM_KANGNAM" },
            { id: "S03", name: "정디지털", role: "WM디지털PB", orgCode: "WM_KANGNAM" },
            // 여의도WM 소속
            { id: "S04", name: "오책임", role: "책임PB", orgCode: "WM_YEOUIDO" }
        ];

        // 3. 성과 데이터 DB (Quarter별 데이터)
        // Unit: 억(Asset), 억(Rev, Consult) / Percent: 0~100+
        const perfDB = {
            "S01": { // 박수석
                q1: { asset: 3000, rev: 5.0, consult: 1.5, p_asset: 90, p_rev: 85, p_consult: 70, p_kpi: 88, bep1: 110, bep2: 105 },
                q2: { asset: 3200, rev: 6.2, consult: 2.1, p_asset: 105, p_rev: 110, p_consult: 120, p_kpi: 115, bep1: 130, bep2: 120 }
            },
            "S02": { // 최선임
                q1: { asset: 1500, rev: 2.0, consult: 0.5, p_asset: 80, p_rev: 70, p_consult: 40, p_kpi: 75, bep1: 85, bep2: 60 },
                q2: { asset: 1600, rev: 2.5, consult: 0.8, p_asset: 85, p_rev: 80, p_consult: 60, p_kpi: 82, bep1: 95, bep2: 75 }
            },
            "S03": { // 정디지털
                q1: { asset: 500, rev: 0.8, consult: 0.1, p_asset: 120, p_rev: 60, p_consult: 20, p_kpi: 70, bep1: 50, bep2: 30 },
                q2: { asset: 600, rev: 1.2, consult: 0.2, p_asset: 130, p_rev: 90, p_consult: 30, p_kpi: 85, bep1: 70, bep2: 40 }
            },
            "S04": { // 오책임 (여의도)
                q2: { asset: 2000, rev: 4.0, consult: 1.0, p_asset: 100, p_rev: 100, p_consult: 100, p_kpi: 100, bep1: 100, bep2: 100 }
            }
        };

        // ===============================================
        // [시스템 로직]
        // ===============================================

        let currentUser = null;
        let currentTab = 'team'; // team or staff
        let selectedStaffId = null; // null이면 전체(Team)

        // 1. 로그인 처리
        function handleLogin() {
            const id = document.getElementById('login-id').value;
            const birth = document.getElementById('login-birth').value;
            
            // DB 매칭 확인
            const user = managerDB.find(u => u.id === id && u.birth === birth);

            if (user) {
                currentUser = user;
                document.getElementById('login-page').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                document.getElementById('user-display').innerText = `${user.name} 님 (${user.orgName})`;
                
                // 초기화: 지점 현황 탭 선택
                setTab('team');
            } else {
                document.getElementById('login-msg').style.display = 'block';
            }
        }

        // 2. 탭 전환 (지점 현황 vs 직원 명단)
        function setTab(tabName) {
            currentTab = tabName;
            
            // 탭 UI 변경
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            if(tabName === 'team') tabs.classList.add('active');
            else tabs.classList.add('active');

            renderList();
        }

        // 3. 리스트 렌더링 (핵심: 조직 코드 필터링)
        function renderList() {
            const container = document.getElementById('list-container');
            container.innerHTML = ''; // 초기화

            if (currentTab === 'team') {
                // 지점 전체 보기 버튼 생성
                const div = document.createElement('div');
                div.className = 'list-item selected';
                div.innerHTML = `
                    <div>
                        <div class="staff-name">${currentUser.orgName} 전체</div>
                        <div class="staff-role">통합 성과 조회</div>
                    </div>
                    <i class="fas fa-chevron-right" style="color:#ccc;"></i>
                `;
                div.onclick = () => selectStaff('TOTAL');
                container.appendChild(div);
                
                // PC화면이면 바로 로딩
                if(window.innerWidth > 768) selectStaff('TOTAL');

            } else {
                // 내 조직 직원만 필터링
                const myStaffs = staffDB.filter(s => s.orgCode === currentUser.orgCode);
                
                myStaffs.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `
                        <div>
                            <div class="staff-name">${s.name}</div>
                            <div class="staff-role">${s.role}</div>
                        </div>
                        <i class="fas fa-chevron-right" style="color:#ccc;"></i>
                    `;
                    div.onclick = () => {
                        // 선택 효과
                        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('selected'));
                        div.classList.add('selected');
                        selectStaff(s.id);
                    };
                    container.appendChild(div);
                });
            }
        }

        // 4. 직원 선택 시 대시보드 활성화
        function selectStaff(id) {
            selectedStaffId = id;
            
            // 모바일: 화면 슬라이드
            if(window.innerWidth <= 768) {
                document.getElementById('content-body').classList.add('show-dashboard');
            }

            renderDashboard();
        }

        function closeDashboard() {
            document.getElementById('content-body').classList.remove('show-dashboard');
        }

        // 5. 대시보드 데이터 그리기 (Top Cards + 6대 지표)
        function renderDashboard() {
            if (!selectedStaffId) return;

            const q = document.getElementById('q-select').value;
            let data = null;
            let nameTitle = "";

            if (selectedStaffId === 'TOTAL') {
                // [합산 로직] 지점 전체
                nameTitle = `${currentUser.orgName} 요약`;
                // 실제 합산 로직은 복잡하므로 여기서는 시뮬레이션 데이터 생성
                data = { 
                    asset: 0, rev: 0, consult: 0, 
                    p_asset: 95, p_rev: 92, p_consult: 80, p_kpi: 90, bep1: 105, bep2: 95 
                };
                
                // 현재 조직 직원들의 데이터 합산
                const myStaffs = staffDB.filter(s => s.orgCode === currentUser.orgCode);
                myStaffs.forEach(s => {
                    const p = perfDB[s.id] ? perfDB[s.id][q] : null;
                    if(p) {
                        data.asset += p.asset;
                        data.rev += p.rev;
                        data.consult += p.consult;
                    }
                });

            } else {
                // [개별 로직]
                const staff = staffDB.find(s => s.id === selectedStaffId);
                nameTitle = `${staff.name} ${staff.role}`;
                
                if (perfDB[selectedStaffId] && perfDB[selectedStaffId][q]) {
                    data = perfDB[selectedStaffId][q];
                } else {
                    // 데이터 없음 처리
                    data = { asset:0, rev:0, consult:0, p_asset:0, p_rev:0, p_consult:0, p_kpi:0, bep1:0, bep2:0 };
                }
            }

            // [UI 업데이트]
            document.getElementById('dash-title').innerText = nameTitle;

            // 1) 1x3 Top Cards
            document.getElementById('val-asset').innerText = data.asset.toLocaleString() + "억";
            document.getElementById('val-rev').innerText = data.rev.toFixed(1) + "억";
            document.getElementById('val-consult').innerText = data.consult.toFixed(1) + "억";

            // 2) 6대 백분율 지표 (함수로 처리)
            updateBar('asset', data.p_asset);
            updateBar('rev', data.p_rev);
            updateBar('consult', data.p_consult);
            updateBar('kpi', data.p_kpi);
            updateBar('bep1', data.p_bep1 || data.bep1); // 인정수익 BEP
            updateBar('bep2', data.p_bep2 || data.bep2); // 컨설팅 BEP
        }

        function updateBar(key, percent) {
            const bar = document.getElementById(`bar-${key}`);
            const text = document.getElementById(`per-${key}`);
            
            // 바 길이 (최대 100%)
            let width = percent > 100 ? 100 : percent;
            bar.style.width = width + "%";
            
            // 텍스트
            text.innerText = percent + "%";
            
            // 컬러링: 100% 넘으면 강조, 낮으면 회색 처리 등
            if (key !== 'kpi' && key !== 'bep1' && key !== 'bep2') {
                bar.style.backgroundColor = percent >= 100 ? '#f26522' : '#002d72';
            }
        }

    </script>
</body>
</html>
